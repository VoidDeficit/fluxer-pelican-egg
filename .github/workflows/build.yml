name: Build image

on:
  push:
    branches: [main]
    paths: [Dockerfile, entrypoint.sh, .github/workflows/build.yml]
  schedule:
    - cron: "0 4 * * 1"   # weekly rebuild against the latest Fluxer
  workflow_dispatch:
    inputs:
      fluxer_ref:
        description: Fluxer branch, tag or commit to build
        default: main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fluxer-pelican

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space (Fluxer build needs ~15 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - name: Check out Fluxer
        uses: actions/checkout@v4
        with:
          repository: fluxerapp/fluxer
          ref: ${{ inputs.fluxer_ref || 'main' }}
          path: fluxer

      - name: Build Fluxer image (fluxer:dev)
        working-directory: fluxer
        run: |
          make image IMAGE=fluxer:dev
          echo "FLUXER_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Pelican image
        run: |
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build --build-arg BASE=fluxer:dev \
            -t "$IMAGE:latest" -t "$IMAGE:fluxer-$FLUXER_SHA" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:fluxer-$FLUXER_SHA"
